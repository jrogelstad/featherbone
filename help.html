<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Featherbone Help</title>
<link rel="icon" href="/media/featherbone.png">
<style>
:root{
  --bg:#fff; --fg:#1d2129; --muted:#5d6672; --faint:#8a929e;
  --line:#e3e6ea; --line2:#eef0f3; --accent:#1a6ec4; --accent-bg:#eaf2fb;
  --code-bg:#f5f6f8; --sidebar:#fafbfc;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --fg:#e4e7ea; --muted:#9aa3af; --faint:#6f7884;
    --line:#2b3037; --line2:#23272d; --accent:#64a9ec; --accent-bg:#1b2836;
    --code-bg:#1d2127; --sidebar:#121519;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --fg:#e4e7ea; --muted:#9aa3af; --faint:#6f7884;
  --line:#2b3037; --line2:#23272d; --accent:#64a9ec; --accent-bg:#1b2836;
  --code-bg:#1d2127; --sidebar:#121519;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);
  -webkit-text-size-adjust:100%}

/* a narrow window is the normal case here, so the bar is the navigation */
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;
  padding:8px 12px;background:var(--sidebar);
  border-bottom:1px solid var(--line)}
.bar button{font:14px var(--sans);color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.bar button:hover:enabled{border-color:var(--accent);color:var(--accent)}
.bar button:disabled{color:var(--faint);cursor:default}
.bar .where{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:12.5px;color:var(--faint)}
select{font:14px var(--sans);color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:5px 7px;max-width:45%}

main{padding:20px 22px 70px;max-width:820px;margin:0 auto}
h1{margin:0 0 14px;font-size:25px;letter-spacing:-.02em}
h2{margin:30px 0 6px;font-size:19px;letter-spacing:-.015em;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{margin:22px 0 5px;font-size:16px}
h4{margin:18px 0 4px;font-size:14px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint)}
p,ul,ol{margin:0 0 11px}
ul,ol{padding-left:22px}
li{margin:0 0 5px}
a{color:var(--accent)}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;
  font:13px var(--mono)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;overflow-x:auto;margin:0 0 12px}
pre code{background:none;padding:0;line-height:1.55}
table{border-collapse:collapse;width:100%;margin:0 0 13px;font-size:13.5px;
  display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;
  vertical-align:top}
th{background:var(--code-bg);font-weight:650}
img{max-width:100%}
blockquote{margin:0 0 12px;padding:8px 13px;color:var(--muted);
  background:var(--code-bg);border-left:3px solid var(--line);
  border-radius:0 7px 7px 0}
blockquote p:last-child{margin:0}

/* the customer's own help, kept visibly theirs rather than the vendor's */
.supplement{margin:0 0 22px;padding:12px 14px;border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 9px 9px 0;
  background:var(--accent-bg)}
.supplement h4{margin:0 0 4px;color:var(--accent)}
.supplement p{margin:0}
.note{color:var(--faint);font-size:13.5px}

/* contents: every module that has help, the generic pages first */
.shelf{margin:0 0 26px}
.shelf h2{margin:0 0 8px}
.shelf ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.shelf a{display:block;text-decoration:none;color:var(--fg);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:14px}
.shelf a:hover{border-color:var(--accent);background:var(--accent-bg);
  color:var(--accent)}

@media (max-width:620px){
  main{padding:16px 14px 60px}
  h1{font-size:21px}
}
@page{margin:16mm 15mm}
@media print{
  :root{--bg:#fff;--fg:#000;--muted:#2b2b2b;--faint:#4a4a4a;--line:#aaa;
    --line2:#ddd;--accent:#000;--accent-bg:#fff;--code-bg:#f2f2f2}
  .bar{display:none}
  main{max-width:none;padding:0;font-size:12pt}
}
</style>
</head>
<body>
<div class="bar">
    <button id="fb-help-back" title="Back" disabled>&#8592;</button>
    <button id="fb-help-forward" title="Forward" disabled>&#8594;</button>
    <button id="fb-help-contents" title="Everything there is help for">
        Contents
    </button>
    <select id="fb-help-pages" title="Pages in this section"></select>
    <span class="where" id="fb-help-where"></span>
    <button id="fb-help-print" title="Print this page">Print</button>
</div>
<main id="fb-help-main"><p class="note">Loading help&hellip;</p></main>
<script src="/node_modules/marked/lib/marked.umd.js"></script>
<script src="/client/help-window.js"></script>
</body>
</html>
